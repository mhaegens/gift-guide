services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gift-guide-app
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    volumes:
      - gift-guide-data:/app/data
    networks:
      - coolify
    restart: unless-stopped

volumes:
  gift-guide-data:
    driver: local

networks:
  coolify:
    external: true
